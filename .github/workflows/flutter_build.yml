name: Flutter APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # SETUP FLUTTER
      # ============================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      # ============================================
      # CREATE FRESH ANDROID PROJECT
      # ============================================

      - name: Create Android Flutter Project
        run: |
          rm -rf build_app

          flutter create \
            --platforms=android \
            --project-name esp_health_monitor \
            build_app

      # ============================================
      # ADD INTERNET PERMISSION
      # ============================================

      - name: Configure Android Network Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_app/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if permission not in text:
              text = text.replace(
                  '<manifest ',
                  '<manifest ',
                  1
              )

              marker = '>\n'

              position = text.find(marker)

              if position != -1:
                  position += len(marker)

                  text = (
                      text[:position]
                      + '    '
                      + permission
                      + '\n'
                      + text[position:]
                  )

          manifest.write_text(text)
          PY

      # ============================================
      # ALLOW HTTP CONNECTION TO ESP32
      # ============================================

      - name: Configure Android Cleartext HTTP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_app/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          if "android:usesCleartextTraffic=" not in text:
              text = text.replace(
                  "<application ",
                  '<application android:usesCleartextTraffic="true" ',
                  1
              )

          manifest.write_text(text)
          PY

      # ============================================
      # CREATE NETWORK SECURITY CONFIG
      # ============================================

      - name: Create Network Security Configuration
        run: |
          mkdir -p build_app/android/app/src/main/res/xml

          cat > build_app/android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>

              <domain-config cleartextTrafficPermitted="true">

                  <domain includeSubdomains="true">
                      192.168.1.12
                  </domain>

              </domain-config>

          </network-security-config>
          EOF

      # ============================================
      # CONNECT NETWORK SECURITY CONFIG
      # ============================================

      - name: Attach Network Security Configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_app/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          attribute = (
              'android:networkSecurityConfig='
              '"@xml/network_security_config"'
          )

          if "android:networkSecurityConfig=" not in text:
              text = text.replace(
                  "<application ",
                  '<application '
                  'android:networkSecurityConfig="@xml/network_security_config" ',
                  1
              )

          manifest.write_text(text)
          PY

      # ============================================
      # SHOW MANIFEST FOR VERIFICATION
      # ============================================

      - name: Verify Android Manifest
        run: |
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat build_app/android/app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "NETWORK SECURITY CONFIG"
          echo "========================================"

          cat build_app/android/app/src/main/res/xml/network_security_config.xml

      # ============================================
      # COPY FLUTTER APPLICATION
      # ============================================

      - name: Copy Application Files
        run: |
          rm -rf build_app/lib

          cp -r Flutter/lib build_app/lib

          cp Flutter/pubspec.yaml build_app/pubspec.yaml

      # ============================================
      # INSTALL DEPENDENCIES
      # ============================================

      - name: Install Dependencies
        working-directory: build_app
        run: |
          flutter pub get

      # ============================================
      # BUILD APK
      # ============================================

      - name: Build APK
        working-directory: build_app
        run: |
          flutter build apk --release

      # ============================================
      # UPLOAD APK
      # ============================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esp-health-monitor-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
